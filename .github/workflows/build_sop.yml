name: Compilar Visor de SOPs Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar librerías y dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pandas customtkinter pillow openpyxl pyinstaller

    - name: Generar ejecutable Optimizado (--onedir)
      run: |
        pyinstaller --noconfirm --onedir --windowed --collect-all customtkinter sop_viewer.py

    - name: Comprimir directorio completo a ZIP
      shell: powershell
      run: |
        Compress-Archive -Path "dist/sop_viewer/*" -DestinationPath "dist/Visor_SOPs_Windows.zip" -Force

    - name: Guardar ejecutable descargable
      uses: actions/upload-artifact@v4
      with:
        name: Visor_SOPs_Windows
        path: dist/Visor_SOPs_Windows.zip
